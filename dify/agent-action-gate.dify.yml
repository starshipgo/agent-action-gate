    - data:
        code: "function main({\n  agent_role,\n  tool_name,\n  arguments_json,\n \
          \ request_tenant\n}) {\n  const normalizedRole = String(agent_role ?? \"\
          \")\n    .trim()\n    .toLowerCase();\n\n  const normalizedTool = String(tool_name\
          \ ?? \"\")\n    .trim()\n    .toLowerCase();\n\n  const normalizedRequestTenant\
          \ = String(request_tenant ?? \"\")\n    .trim()\n    .toLowerCase();\n\n\
          \  let args = {};\n  let parseOk = true;\n  let parseError = \"\";\n\n \
          \ try {\n    const parsed = JSON.parse(String(arguments_json ?? \"\"));\n\
          \n    if (\n      parsed === null ||\n      Array.isArray(parsed) ||\n \
          \     typeof parsed !== \"object\"\n    ) {\n      throw new Error(\"arguments_json\
          \ must be a JSON object\");\n    }\n\n    args = parsed;\n  } catch (error)\
          \ {\n    parseOk = false;\n    parseError =\n      error instanceof Error\n\
          \        ? error.message\n        : String(error);\n  }\n\n  const targetTenant\
          \ =\n    parseOk && typeof args.target_tenant === \"string\"\n      ? args.target_tenant.trim().toLowerCase()\n\
          \      : \"\";\n\n  let amount = null;\n\n  if (parseOk && typeof args.amount\
          \ === \"number\" && Number.isFinite(args.amount)) {\n    amount = args.amount;\n\
          \  } else if (\n    parseOk &&\n    typeof args.amount === \"string\" &&\n\
          \    args.amount.trim() !== \"\" &&\n    Number.isFinite(Number(args.amount))\n\
          \  ) {\n    amount = Number(args.amount);\n  }\n\n  const recipient =\n\
          \    parseOk && typeof args.to === \"string\"\n      ? args.to.trim().toLowerCase()\n\
          \      : \"\";\n\n  return {\n    normalized: {\n      agent_role: normalizedRole,\n\
          \      tool_name: normalizedTool,\n      request_tenant: normalizedRequestTenant,\n\
          \      target_tenant: targetTenant,\n      amount,\n      recipient,\n \
          \     args\n    },\n    parse_ok: parseOk,\n    parse_error: parseError\n\
          \  };\n}"
        code_language: javascript
        desc: 把 Agent 给进来的“乱格式原始数据”，先清洗成统一、可靠的格式。
