    - data:
        code: "function main({ normalized, risk }) {\n  const n =\n    normalized\
          \ && typeof normalized === \"object\"\n      ? normalized\n      : {};\n\
          \n  const r =\n    risk && typeof risk === \"object\"\n      ? risk\n  \
          \    : {};\n\n  function toBoolean(value) {\n    if (value === true) {\n\
          \      return true;\n    }\n\n    if (typeof value === \"string\") {\n \
          \     return value.trim().toLowerCase() === \"true\";\n    }\n\n    return\
          \ false;\n  }\n\n  const tool = String(n.tool_name ?? \"\");\n  const requestTenant\
          \ = String(n.request_tenant ?? \"\");\n  const targetTenant = String(n.target_tenant\
          \ ?? \"\");\n  const amount = n.amount;\n  const args = n.args ?? {};\n\n\
          \  const promptInjection =\n    toBoolean(r.prompt_injection);\n\n  const\
          \ dataExfiltration =\n    toBoolean(r.data_exfiltration);\n\n  const socialEngineering\
          \ =\n    toBoolean(r.social_engineering);\n\n  const suspiciousInstruction\
          \ =\n    toBoolean(r.suspicious_instruction);\n\n  const knownTools = new\
          \ Set([\n    \"crm.read_contact\",\n    \"ticket.create\",\n    \"email.draft\"\
          ,\n    \"email.send\",\n    \"refund.create\",\n    \"customer.export\"\
          ,\n    \"secret.read\"\n  ]);\n\n  function result(\n    decision,\n   \
          \ riskLevel,\n    policyCodes,\n    requiresApproval\n  ) {\n    return\
          \ {\n      decision,\n      risk_level: riskLevel,\n      policy_codes:\
          \ policyCodes,\n      requires_approval: requiresApproval,\n      normalized_tool:\
          \ tool,\n      normalized_args: args\n    };\n  }\n\n  // Unknown tool →\
          \ fail closed.\n  if (!knownTools.has(tool)) {\n    return result(\n   \
          \   \"DENY\",\n      \"high\",\n      [\"UNKNOWN_TOOL\"],\n      false\n\
          \    );\n  }\n\n  // Cross-tenant access.\n  if (\n    requestTenant &&\n\
          \    targetTenant &&\n    requestTenant !== targetTenant\n  ) {\n    return\
          \ result(\n      \"DENY\",\n      \"critical\",\n      [\"CROSS_TENANT_ACCESS\"\
          ],\n      false\n    );\n  }\n\n  // Explicitly forbidden tools.\n  if (tool\
          \ === \"secret.read\") {\n    return result(\n      \"DENY\",\n      \"\
          critical\",\n      [\"FORBIDDEN_SECRET_ACCESS\"],\n      false\n    );\n\
          \  }\n\n  if (tool === \"customer.export\") {\n    return result(\n    \
          \  \"DENY\",\n      \"critical\",\n      [\"SENSITIVE_EXPORT\"],\n     \
          \ false\n    );\n  }\n\n  // Semantic security signals from the LLM sensor.\n\
          \  const strongSemanticRisk =\n    promptInjection ||\n    dataExfiltration\
          \ ||\n    suspiciousInstruction;\n\n  if (strongSemanticRisk) {\n    const\
          \ codes = [];\n\n    if (promptInjection) {\n      codes.push(\"PROMPT_INJECTION_SIGNAL\"\
          );\n    }\n\n    if (dataExfiltration) {\n      codes.push(\"DATA_EXFILTRATION_SIGNAL\"\
          );\n    }\n\n    if (suspiciousInstruction) {\n      codes.push(\"SUSPICIOUS_INSTRUCTION\"\
          );\n    }\n\n    if (socialEngineering) {\n      codes.push(\"SOCIAL_ENGINEERING_SIGNAL\"\
          );\n    }\n\n    return result(\n      \"DENY\",\n      \"high\",\n    \
          \  codes,\n      false\n    );\n  }\n\n  // Sending email requires human\
          \ approval.\n  if (tool === \"email.send\") {\n    return result(\n    \
          \  \"REQUIRE_APPROVAL\",\n      \"medium\",\n      [\"OUTBOUND_SEND\"],\n\
          \      true\n    );\n  }\n\n  // Refund policy.\n  if (tool === \"refund.create\"\
          ) {\n    if (\n      typeof amount !== \"number\" ||\n      !Number.isFinite(amount)\n\
          \    ) {\n      return result(\n        \"DENY\",\n        \"high\",\n \
          \       [\"INVALID_REFUND_AMOUNT\"],\n        false\n      );\n    }\n\n\
          \    if (amount > 500) {\n      return result(\n        \"DENY\",\n    \
          \    \"high\",\n        [\"REFUND_LIMIT_EXCEEDED\"],\n        false\n  \
          \    );\n    }\n\n    return result(\n      \"REQUIRE_APPROVAL\",\n    \
          \  \"medium\",\n      [\"REFUND_REQUIRES_APPROVAL\"],\n      true\n    );\n\
          \  }\n\n  // Low-risk allowlisted actions.\n  if (\n    tool === \"crm.read_contact\"\
          \ ||\n    tool === \"ticket.create\" ||\n    tool === \"email.draft\"\n\
          \  ) {\n    return result(\n      \"ALLOW\",\n      \"low\",\n      [],\n\
          \      false\n    );\n  }\n\n  return result(\n    \"DENY\",\n    \"high\"\
          ,\n    [\"NO_MATCHING_POLICY\"],\n    false\n  );\n}"
        code_language: javascript
        desc: '真正决定 ALLOW / REQUIRE_APPROVAL / DENY

          '
